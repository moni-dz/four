[package]
name = "four"
version = "0.1.0"
edition = "2024"
description = "A minimal GPUI image viewer with bounded image decoders"
publish = false

[workspace]
default-members = [".", "crates/tonemapping"]
members = ["crates/tonemapping"]
resolver = "3"

[workspace.dependencies]
mimalloc = "0.1.48"
multiversion = "0.8.0"

[dependencies]
exn = "0.3.1"
gif = "0.14.2"
gpui = { git = "https://github.com/zed-industries/zed", rev = "38ca9106c5306ef93e52c35643df015a27f15b72" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "38ca9106c5306ef93e52c35643df015a27f15b72", features = ["font-kit", "wayland", "x11"] }
jxl-oxide = { version = "0.12.6", default-features = false, features = ["moxcms", "rayon"] }
jpegxr = "0.3.1"
multiversion = { workspace = true }
mimalloc = { workspace = true }
png = "0.18.1"
tiff = "0.11.3"
tonemapping = { path = "crates/tonemapping" }
zune-jpeg = "0.5.15"

[dev-dependencies]
crc32fast = "1.5.0"

[lints]
workspace = true

[profile.bench]
debug = 1

[workspace.lints.rust]
ambiguous_negative_literals = "warn"
missing_debug_implementations = "warn"
redundant_imports = "warn"
redundant_lifetimes = "warn"
trivial_numeric_casts = "warn"
unsafe_code = "warn"
unsafe_op_in_unsafe_fn = "warn"
unused_lifetimes = "warn"

[workspace.lints.clippy]
cargo = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
allow_attributes_without_reason = "warn"
as_pointer_underscore = "warn"
assertions_on_result_states = "warn"
clone_on_ref_ptr = "warn"
deref_by_slicing = "warn"
disallowed_script_idents = "warn"
empty_drop = "warn"
empty_enum_variants_with_brackets = "warn"
empty_structs_with_brackets = "warn"
fn_to_numeric_cast_any = "warn"
if_then_some_else_none = "warn"
map_err_ignore = "warn"
redundant_type_annotations = "warn"
renamed_function_params = "warn"
semicolon_outside_block = "warn"
undocumented_unsafe_blocks = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
unneeded_field_pattern = "warn"
unused_result_ok = "warn"
too_long_first_doc_paragraph = "warn"
upper_case_acronyms = "allow"
literal_string_with_formatting_args = "allow"
multiple_crate_versions = "allow"
